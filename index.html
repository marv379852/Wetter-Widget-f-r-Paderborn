<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wetter Live - Paderborn</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f0f0; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .widget { width: 420px; height: 480px; background: white; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); position: relative; overflow: hidden; cursor: move; user-select: none; }
        .header { background: linear-gradient(135deg, #add8e6, #87ceeb); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; color: white; font-weight: bold; }
        .title { font-size: 16px; }
        .close-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 25px; height: 25px; border-radius: 50%; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; }
        .close-btn:hover { background: rgba(255,0,0,0.3); }
        .current { padding: 20px 20px 10px; text-align: center; }
        .temp { font-size: 72px; font-weight: bold; color: #333; margin-bottom: 10px; }
        .details { display: grid; grid-template-columns: 1fr; gap: 8px; font-size: 14px; color: #555; }
        .graph-container { position: relative; width: 100%; height: 180px; background: white; }
        #graphCanvas { width: 100%; height: 100%; display: block; }
        .daily { padding: 0 20px 20px; text-align: center; font-size: 14px; color: #666; background: #f9f9f9; }
        .refresh-btn { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: #4CAF50; color: white; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-size: 12px; width: 90%; }
        .refresh-btn:disabled { background: #ccc; cursor: not-allowed; }
        .loading { opacity: 0.5; }
        .error { color: #f44336 !important; font-weight: bold; }
        @media (max-width: 450px) { .widget { width: 95vw; height: 90vh; max-width: 420px; max-height: 480px; } }
    </style>
</head>
<body>
    <div class="widget" id="widget">
        <div class="header">
            <div class="title">Wetter Live - Paderborn</div>
            <button class="close-btn" onclick="document.body.innerHTML=''">_</button>
        </div>
        <div class="current">
            <div class="temp" id="temp">Lade...</div>
            <div class="details" id="details">
                <div id="lastUpdate">Updated: --:--</div>
            </div>
        </div>
        <div class="graph-container">
            <canvas id="graphCanvas"></canvas>
        </div>
        <div class="daily" id="daily">Lade...</div>
        <button class="refresh-btn" id="refreshBtn">↻ Update (Verfügbar jede 15 Minuten)</button>
    </div>
    <script>
        const API_URL = 'https://api.open-meteo.com/v1/forecast?latitude=51.72&longitude=8.76&current=temperature_2m,rain,wind_speed_10m&hourly=temperature_2m,precipitation_probability&daily=precipitation_probability_max,wind_speed_10m_max&timezone=Europe/Berlin';
        const widget = document.getElementById('widget'), tempEl = document.getElementById('temp'), detailsEl = document.getElementById('details'), canvas = document.getElementById('graphCanvas'), ctx = canvas.getContext('2d'), dailyEl = document.getElementById('daily'), refreshBtn = document.getElementById('refreshBtn');
        let times = [], temperatures = [], isDragging = false, startX, startY, initX, initY;
        const header = widget.querySelector('.header');
        header.addEventListener('mousedown', e => { isDragging = true; startX = e.clientX; startY = e.clientY; initX = widget.offsetLeft; initY = widget.offsetTop; widget.style.transition = 'none'; });
        document.addEventListener('mousemove', e => { if (isDragging) { const dx = e.clientX - startX, dy = e.clientY - startY; widget.style.left = (initX + dx) + 'px'; widget.style.top = (initY + dy) + 'px'; widget.style.position = 'fixed'; } });
        document.addEventListener('mouseup', () => { isDragging = false; widget.style.transition = 'all 0.2s'; });
        function resizeCanvas() { canvas.width = canvas.offsetWidth * (window.devicePixelRatio || 1); canvas.height = canvas.offsetHeight * (window.devicePixelRatio || 1); drawGraph(); }
        window.addEventListener('resize', resizeCanvas); resizeCanvas();
        async function fetchLive() { refreshBtn.disabled = true; refreshBtn.textContent = 'Laden...'; widget.classList.add('loading'); try { const res = await fetch(API_URL); const data = await res.json(); updateUI(data); } catch(e) { showError('Netzwerk: ' + e.message); } }
        function updateUI(data) { const c = data.current; tempEl.textContent = c.temperature_2m.toFixed(1) + '°'; detailsEl.innerHTML = `🌧️ ${c.rain.toFixed(1)} mm<br>💨 ${c.wind_speed_10m.toFixed(1)} km/h<br>🕐 ${new Date(c.time).toLocaleTimeString('de', {hour:'2-digit', minute:'2-digit'})}<br>Updated: ${new Date().toLocaleTimeString('de',{hour:'2-digit', minute:'2-digit'})}`; const h = data.hourly; times = h.time.slice(0,24).map(t=>new Date(t).toLocaleTimeString('de',{hour:'2-digit', minute:'2-digit'})); temperatures = h.temperature_2m.slice(0,24); drawGraph(); const d = data.daily; dailyEl.textContent = `Heute: ${d.precipitation_probability_max[0]}% Regen, max Wind ${d.wind_speed_10m_max[0].toFixed(0)} km/h`; refreshBtn.textContent = '↻ Update (15min)'; refreshBtn.disabled = false; widget.classList.remove('loading'); }
        function drawGraph() { const dpr = window.devicePixelRatio || 1, w = canvas.width/dpr, h = canvas.height/dpr, margin = 40, gw = w-80, gh = h-80; ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle='white'; ctx.fillRect(0,0,canvas.width,canvas.height); if (!temperatures.length) return; const minT = Math.min(...temperatures), maxT = Math.max(...temperatures), range = maxT-minT||1; ctx.strokeStyle='#ddd'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(margin*dpr,margin*dpr); ctx.lineTo(margin*dpr,(h-margin)*dpr); ctx.lineTo((w-margin)*dpr,(h-margin)*dpr); ctx.stroke(); ctx.strokeStyle='#eee'; for(let i=1;i<5;i++){const y=(h-margin-gh*i/5)*dpr;ctx.beginPath();ctx.moveTo((margin+5)*dpr,y);ctx.lineTo((w-margin-5)*dpr,y);ctx.stroke();} for(let i=1;i<23;i+=2){const x=(margin+gw*i/23)*dpr;ctx.beginPath();ctx.moveTo(x,(margin+5)*dpr);ctx.lineTo(x,(h-margin-5)*dpr);ctx.stroke();} ctx.fillStyle='#333'; ctx.font=`${10*dpr}px Arial`; ctx.textAlign='left'; ctx.textBaseline='middle'; for(let i=0;i<=5;i++){const temp=maxT-range*i/5; const y=(margin+gh*i/5)*dpr; ctx.fillText(temp.toFixed(0)+'°',5*dpr,y);} ctx.strokeStyle='#3498db'; ctx.lineWidth=3*dpr; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.beginPath(); temperatures.forEach((t,i)=>{const x=(margin+gw*i/23)*dpr, y=((h-margin)-gh*(t-minT)/range)*dpr; i?ctx.lineTo(x,y):ctx.moveTo(x,y);}); ctx.stroke(); temperatures.forEach((t,i)=>{const x=(margin+gw*i/23)*dpr, y=((h-margin)-gh*(t-minT)/range)*dpr; ctx.beginPath();ctx.arc(x,y,4*dpr,0,Math.PI*2);ctx.fillStyle='#3498db';ctx.fill();ctx.strokeStyle='white';ctx.lineWidth=1.5*dpr;ctx.stroke();}); ctx.textAlign='center'; ctx.textBaseline='top'; times.forEach((t,i)=>{if(i%4===0){const x=(margin+gw*i/23)*dpr;ctx.fillText(t,x,(h-margin+5)*dpr);}}); }
        function showError(msg) { tempEl.textContent = 'Fehler'; tempEl.classList.add('error'); detailsEl.innerHTML = `<div class="error">${msg}</div>`; dailyEl.textContent = ''; refreshBtn.textContent = '↻ Wiederholen'; refreshBtn.disabled = false; widget.classList.remove('loading'); }
        refreshBtn.onclick = fetchLive; fetchLive(); setInterval(fetchLive,900000);
    </script>
</body>
</html>
