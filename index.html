<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wetter Live - Paderborn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .widget {
            width: 420px;
            height: 480px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            cursor: move;
            user-select: none;
        }
        .header {
            background: linear-gradient(135deg, #add8e6, #87ceeb);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-weight: bold;
        }
        .title {
            font-size: 16px;
        }
        .close-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .close-btn:hover {
            background: rgba(255,0,0,0.3);
        }
        .current {
            padding: 20px 20px 10px;
            text-align: center;
        }
        .temp {
            font-size: 72px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .details {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px 20px;
            font-size: 14px;
            color: #555;
        }
        .graph-container {
            position: relative;
            width: 100%;
            height: 180px;
            background: white;
        }
        #graphCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .daily {
            padding: 0 20px 20px;
            text-align: center;
            font-size: 14px;
            color: #666;
            background: #f9f9f9;
        }
        .refresh-btn {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            width: 90%;
        }
        .refresh-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .loading {
            opacity: 0.5;
        }
        .error {
            color: #f44336;
            font-weight: bold;
        }
        @media (max-width: 450px) {
            .widget {
                width: 95vw;
                height: 90vh;
                max-width: 420px;
                max-height: 480px;
            }
        }
    </style>
</head>
<body>
    <div class="widget" id="widget">
        <div class="header">
            <div class="title">Wetter Live - Paderborn</div>
            <button class="close-btn" onclick="window.close()">X</button>
        </div>
        <div class="current">
            <div class="temp" id="temp">Lade...</div>
            <div class="details" id="details">
                <div id="lastUpdate">Updated: --:--</div>
            </div>
        </div>
        <div class="graph-container">
            <canvas id="graphCanvas"></canvas>
        </div>
        <div class="daily" id="daily">Lade...</div>
        <button class="refresh-btn" id="refreshBtn" onclick="fetchLive()">↻ Update (Verfügbar jede 15 Minuten)</button>
    </div>

    <script>
        const API_URL = 'https://api.open-meteo.com/v1/forecast?latitude=51.72&longitude=8.76&current=temperature_2m,rain,wind_speed_10m&hourly=temperature_2m,precipitation_probability&daily=precipitation_probability_max,wind_speed_10m_max&timezone=Europe/Berlin';

        const widget = document.getElementById('widget');
        const tempEl = document.getElementById('temp');
        const detailsEl = document.getElementById('details');
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        const dailyEl = document.getElementById('daily');
        const refreshBtn = document.getElementById('refreshBtn');
        const lastUpdateEl = document.getElementById('lastUpdate');

        let times = [];
        let temperatures = [];
        let isDragging = false;
        let startX, startY, initX, initY;

        // Make draggable
        const header = widget.querySelector('.header');
        header.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            initX = widget.offsetLeft;
            initY = widget.offsetTop;
            widget.style.transition = 'none';
        });
        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                widget.style.left = (initX + dx) + 'px';
                widget.style.top = (initY + dy) + 'px';
                widget.style.right = 'auto';
                widget.style.bottom = 'auto';
                widget.style.position = 'fixed';
            }
        });
        document.addEventListener('mouseup', () => {
            isDragging = false;
            widget.style.transition = 'all 0.2s ease';
        });

        // Canvas resize
        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            drawGraph();
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        async function fetchLive() {
            refreshBtn.disabled = true;
            refreshBtn.textContent = 'Laden...';
            widget.classList.add('loading');
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Netzwerkfehler');
                const data = await response.json();
                updateUI(data);
            } catch (error) {
                showError('Netzwerk: ' + error.message);
            }
        }

        function updateUI(data) {
            // Current
            const current = data.current;
            tempEl.textContent = current.temperature_2m.toFixed(1) + '°';
            detailsEl.innerHTML = `
                <div>🌧️ ${current.rain.toFixed(1)} mm</div>
                <div>💨 ${current.wind_speed_10m.toFixed(1)} km/h</div>
                <div>🕐 ${new Date(current.time).toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'})}</div>
                <div id="lastUpdate">Updated: ${new Date().toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'})}</div>
            `;

            // Graph
            const hourly = data.hourly;
            times = hourly.time.slice(0, 24).map(t => new Date(t).toLocaleTimeString('de-DE', {hour: '2-digit', minute: '2-digit'}));
            temperatures = hourly.temperature_2m.slice(0, 24);
            drawGraph();

            // Daily
            const daily = data.daily;
            dailyEl.textContent = `Heute: ${daily.precipitation_probability_max[0]}% Regen, max Wind ${daily.wind_speed_10m_max[0].toFixed(0)} km/h`;

            refreshBtn.textContent = '↻ Update (Verfügbar jede 15 Minuten)';
            refreshBtn.disabled = false;
            widget.classList.remove('loading');
        }

        function drawGraph() {
            const w = canvas.width;
            const h = canvas.height;
            const margin = 40;
            const graphW = w - 2 * margin;
            const graphH = h - 2 * margin;

            ctx.clearRect(0, 0, w, h);
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, w, h);

            if (temperatures.length === 0) {
                ctx.fillStyle = '#999';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Lade Graf...', w / 2, h / 2);
                return;
            }

            // Min/max temp
            let minTemp = Math.min(...temperatures);
            let maxTemp = Math.max(...temperatures);
            let tempRange = maxTemp - minTemp;
            if (tempRange < 1) tempRange = 1;

            // Axes
            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(margin, margin);
            ctx.lineTo(margin, h - margin);
            ctx.lineTo(w - margin, h - margin);
            ctx.stroke();

            // Grid
            ctx.strokeStyle = '#eee';
            for (let i = 1; i < 5; i++) {
                const y = h - margin - (graphH * i / 5);
                ctx.beginPath();
                ctx.moveTo(margin + 5, y);
                ctx.lineTo(w - margin - 5, y);
                ctx.stroke();
            }
            for (let i = 1; i < 23; i += 2) {
                const x = margin + (graphW * i / 23);
                ctx.beginPath();
                ctx.moveTo(x, margin + 5);
                ctx.lineTo(x, h - margin - 5);
                ctx.stroke();
            }

            // Y labels (max at top)
            ctx.fillStyle = '#333';
            ctx.font = '10px Arial';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            for (let i = 0; i <= 5; i++) {
                const temp = maxTemp - (tempRange * i / 5);
                const label = temp.toFixed(0) + '°';
                const y = margin + (graphH * i / 5);
                ctx.fillText(label, 5, y);
            }

            // Line
            ctx.strokeStyle = '#3498db';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            for (let i = 0; i < temperatures.length - 1; i++) {
                const x1 = margin + (graphW * i / 23);
                const t1 = temperatures[i];
                const y1 = h - margin - (graphH * (t1 - minTemp) / tempRange);
                if (i === 0) ctx.moveTo(x1, y1);
                else ctx.lineTo(x1, y1);
            }
            ctx.stroke();

            // Dots
            temperatures.forEach((t, i) => {
                const x = margin + (graphW * i / 23);
                const y = h - margin - (graphH * (t - minTemp) / tempRange);
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, 2 * Math.PI);
                ctx.fillStyle = '#3498db';
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });

            // X labels
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            times.forEach((time, i) => {
                if (i % 4 === 0) {
                    const x = margin + (graphW * i / 23);
                    ctx.fillText(time, x, h - margin + 5);
                }
            });
        }

        function showError(msg) {
            tempEl.textContent = 'Fehler';
            tempEl.classList.add('error');
            detailsEl.innerHTML = `<div class="error">${msg}</div>`;
            dailyEl.textContent = '';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            refreshBtn.textContent = '↻ Wiederholen';
            refreshBtn.disabled = false;
            widget.classList.remove('loading');
        }

        // Initial load
        fetchLive();
        setInterval(fetchLive, 15 * 60 * 1000); // Auto update every 15 min
    </script>
</body>
</html>
